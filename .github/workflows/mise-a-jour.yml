# Mise à jour automatique : données -> contrôles -> calculs -> site -> déploiement.
# Si un contrôle qualité bloquant échoue, le job s'arrête avant le déploiement :
# la dernière version valide reste en ligne et une issue est ouverte.
name: Mise à jour

on:
  schedule:
    - cron: "0 5 * * *"              # chaque matin (UTC)
    - cron: "15 13-23/2 * * 5,6,0,1"  # jours de match : toutes les 2 h de 13 h 15 à 23 h 15 UTC (résultats du soir)
  workflow_dispatch:
  # Mise en ligne automatique après une modification du code (pas des données, pour éviter les boucles)
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "config/**", "requirements.txt"]

permissions:
  contents: write
  issues: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances Python
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Pipeline (ingestion, contrôles, modèles, export)
        env:
          FOOTBALL_DATA_ORG_TOKEN: ${{ secrets.FOOTBALL_DATA_ORG_TOKEN }}
        run: python -m pipeline

      - name: Enregistrer les données validées et le journal des prédictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees/
          if ! git diff --cached --quiet; then
            git commit -m "Données : mise à jour du $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Construction du site
        working-directory: site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_URL_DIRECT: ${{ vars.URL_DIRECT }}
          PUBLIC_INDEXABLE: ${{ vars.INDEXABLE }}
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/sitemap.xml

      - name: Déploiement sur Cloudflare (Worker à fichiers statiques)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          wranglerVersion: "4.158.0"
          command: deploy

      - name: Ouvrir une issue en cas d'échec
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titre = "Échec de la mise à jour automatique";
            const ouvertes = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "echec-pipeline" });
            const lien = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (ouvertes.data.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: ouvertes.data[0].number, body: `Nouvel échec : ${lien}` });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: titre, labels: ["echec-pipeline"],
                body: `La mise à jour a échoué. Le site n'a pas été redéployé : la dernière version valide reste en ligne.\n\nDétails : ${lien}` });
            }
