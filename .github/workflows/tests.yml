# À chaque push : tests, pipeline hors ligne (données brutes du dépôt) et construction du site.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Pipeline hors ligne
        run: python -m pipeline --hors-ligne
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Tests du Worker « direct »
        run: node --test worker/test/direct.test.js
      - name: Construction du site
        working-directory: site
        run: |
          npm ci
          npm run build
