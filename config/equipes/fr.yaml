# Référentiel des clubs français : un identifiant stable par club, quelle que soit la source.
# C'EST LE SEUL ENDROIT OÙ LES NOMS AFFICHÉS SONT DÉFINIS (pipeline, site, textes générés) :
#   nom   = nom complet du club (titres de page, sélecteurs)
#   court = nom usuel du club, celui de la presse sportive (tableaux, listes, graphiques)
#   couleur / couleur2 = couleurs principales du maillot (barres et graphiques aux couleurs du club)
# « alias » = toutes les graphies rencontrées dans les sources (football-data.co.uk, openfootball, football-data.org).
# Un nom inconnu bloque le pipeline : il faut l'ajouter ici.

